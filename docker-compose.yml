# gev.beric.ca app container. No Traefik labels on purpose: the public route
# lives on beric-gate (homelab/services/beric-gate), which fronts this
# container on the shared `web` network with the invite gate. Secrets come
# from .env next to this file on the Mac mini (never committed).
services:
  gev-app:
    build:
      context: .
      args:
        GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
        CESIUM_ION_TOKEN: ${CESIUM_ION_TOKEN:-}
    image: gev-app:local
    container_name: gev-app
    restart: unless-stopped
    env_file: .env
    environment:
      - HOST=0.0.0.0
      - PREVIEW_PORT=4173
      - GEV_ALLOWED_HOSTS=gev-app,gev.beric.ca
      # beric-gate proxies every request; see server/providers/common/same-site.js.
      - GEV_PUBLIC_ORIGIN=https://gev.beric.ca
      - TZ=America/Los_Angeles
    volumes:
      # Proxy caches (terrain heights, TomTom, adsbdb, ...). Keeping them on the
      # host means a recreate does not start cold and hammer the upstreams.
      - ./cache:/app/.gev-cache
    networks: [web]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  web:
    external: true
